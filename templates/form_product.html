<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Producto</title>
</head>
<body>
    <h1>{% if product %}Editar Producto{% else %}Nuevo Producto{% endif %}</h1>
    <form method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="name" value="{{ product.name if product else '' }}" required><br><br>
        
        <label>Precio:</label><br>
        <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required><br><br>
        
        <label>Stock (por defecto 0):</label><br>
        <input type="number" name="stock" value="{{ product.stock if product else 0 }}"><br><br>
        
        <button type="submit">Guardar</button>
        <a href="{{ url_for('listar_products') }}">Cancelar</a>
    </form>
</body>
</html>
